repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1  # Use the latest stable version of Black
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: [--profile, black]

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
